#
# Project-specific integration gate. Shared reusable lint/build/REUSE workflows
# come unmodified from LibreCodeCoop/.github and are managed by workflow sync.
name: LibreFinance integrated functionality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: librefinance-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Core API and frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP for native OpenAPI generation
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --include=dev
      - run: npm test
      - run: python3 tests/ci/coverage-inventory.py
      - run: php tests/openapi/generate.php --check
      - run: npm run test:openapi
      - run: npm run build
      - name: Assert production assets are synchronized
        run: git diff --exit-code -- js/main.js css/main.css js/main.js.license openapi.json
      - name: Check optional Nextcloud Files and WebDAV compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
      - name: Assert production assets are synchronized on Node 24
        run: git diff --exit-code -- js/main.js css/main.css js/admin.js css/admin.css js/main.js.license js/admin.js.license openapi.json

  integrated:
    name: Installed Nextcloud + NFS-e draft app / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, sqlite, mariadb]
    steps:
      - name: Checkout LibreFinance core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout reviewed Nextcloud Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: 7a89690a1ca17aae3113da13070487c191eb1f4b
          path: .ci-nextcloud-server
          submodules: recursive
          persist-credentials: false
      - name: Checkout NFS-e drafts module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LibreCodeCoop/librefinance-nfse
          ref: bf277920695388a3b335dfc9190235a52ab0738a
          path: .ci-modules/librefinance_nfse
          persist-credentials: false
      - name: Set up PHP 8.5 for Nextcloud master
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - name: Install Behat API test dependencies
        run: composer install --working-dir=tests/behat --no-interaction --prefer-dist --no-progress
      - name: Verify pinned NFS-e draft app
        run: |
          set -euo pipefail
          for module in nfse; do
            path=".ci-modules/librefinance_${module}"
            test -f "${path}/appinfo/info.xml"
            test -s "${path}/js/main.js"
            test -s "${path}/js/main.js.license"
            test -s "${path}/css/main.css"
          done
      - name: Run complete synthetic core and external-app integration
        env:
          LF_NEXTCLOUD_SOURCE: ${{ github.workspace }}/.ci-nextcloud-server
          LF_NFSE_SOURCE: ${{ github.workspace }}/.ci-modules/librefinance_nfse
          LF_TEST_DATABASE: ${{ matrix.database }}
          LF_RUN_PLAYWRIGHT: '0'
        run: bash tests/ci/smoke.sh

  core-only:
    name: LibreFinance without optional apps / sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout LibreFinance core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout reviewed Nextcloud Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: 7a89690a1ca17aae3113da13070487c191eb1f4b
          path: .ci-nextcloud-server
          submodules: recursive
          persist-credentials: false
      - name: Install and test core, including built-in importer
        env:
          LF_NEXTCLOUD_SOURCE: ${{ github.workspace }}/.ci-nextcloud-server
          LF_TEST_DATABASE: sqlite
          LF_RUN_BEHAT: '0'
          LF_RUN_PLAYWRIGHT: '0'
        run: bash tests/ci/smoke.sh

  upgrade-import:
    name: Preserve historic Import app data / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, sqlite, mariadb]
    steps:
      - name: Checkout LibreFinance core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout reviewed Nextcloud Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: 7a89690a1ca17aae3113da13070487c191eb1f4b
          path: .ci-nextcloud-server
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned pre-consolidation LibreFinance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LibreCodeCoop/librefinance
          ref: caf8fddd9335af9732ac6b1971b9a1c4c998477a
          path: .ci-legacy-core
          persist-credentials: false
      - name: Verify pre-upgrade core and stored-schema fixture
        run: |
          test -s .ci-legacy-core/appinfo/info.xml
          test -s tests/ci/legacy-import-schema.php
      - name: Verify original source IDs, references and balances survive
        env:
          LF_TEST_DATABASE: ${{ matrix.database }}
          LF_NEXTCLOUD_SOURCE: ${{ github.workspace }}/.ci-nextcloud-server
          LF_UPGRADE_OLD_CORE_SOURCE: ${{ github.workspace }}/.ci-legacy-core
        run: bash tests/ci/upgrade-import.sh

      - name: Checkout pinned pre-SaaS LibreFinance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LibreCodeCoop/librefinance
          ref: 192bfb0b479adb62356381acc2e61e58f94d67f7
          path: .ci-pre-saas-core
          persist-credentials: false
      - name: Verify legacy accounting rows and grants survive SaaS upgrade
        env:
          LF_TEST_DATABASE: ${{ matrix.database }}
          LF_NEXTCLOUD_SOURCE: ${{ github.workspace }}/.ci-nextcloud-server
          LF_UPGRADE_OLD_CORE_SOURCE: ${{ github.workspace }}/.ci-pre-saas-core
          LF_UPGRADE_SCENARIO: saas
        run: bash tests/ci/upgrade-import.sh

  # Each Chromium shard has its own disposable Nextcloud and PostgreSQL lab.
  # Do not increase workers inside one shared financial workspace/session.
  browser:
    name: Chromium browser / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - name: Checkout LibreFinance core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout reviewed Nextcloud Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: 7a89690a1ca17aae3113da13070487c191eb1f4b
          path: .ci-nextcloud-server
          submodules: recursive
          persist-credentials: false
      - name: Checkout NFS-e drafts module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LibreCodeCoop/librefinance-nfse
          ref: bf277920695388a3b335dfc9190235a52ab0738a
          path: .ci-modules/librefinance_nfse
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Verify pinned NFS-e draft app build
        run: |
          set -euo pipefail
          for module in nfse; do
            path=".ci-modules/librefinance_${module}"
            test -f "${path}/appinfo/info.xml"
            test -s "${path}/js/main.js"
            test -s "${path}/js/main.js.license"
            test -s "${path}/css/main.css"
          done
      - name: Run isolated browser shard against installed Nextcloud
        env:
          LF_NEXTCLOUD_SOURCE: ${{ github.workspace }}/.ci-nextcloud-server
          LF_NFSE_SOURCE: ${{ github.workspace }}/.ci-modules/librefinance_nfse
          LF_TEST_DATABASE: pgsql
          LF_BROWSER_DEBUG_ONLY: '1'
          LF_RUN_BEHAT: '0'
          LF_RUN_PLAYWRIGHT: '1'
          LF_PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: bash tests/ci/smoke.sh

  ci-required:
    name: LibreFinance integrated CI
    needs: [contracts, integrated, browser, core-only, upgrade-import]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: none
    env:
      CORE_RESULT: ${{ needs.contracts.result }}
      COMBINED_RESULT: ${{ needs.integrated.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      CORE_ONLY_RESULT: ${{ needs.core-only.result }}
      UPGRADE_RESULT: ${{ needs.upgrade-import.result }}
    steps:
      - name: Do not accept failed, cancelled, missing or skipped required jobs
        run: |
          test "$CORE_RESULT" = success
          test "$COMBINED_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$CORE_ONLY_RESULT" = success
          test "$UPGRADE_RESULT" = success
